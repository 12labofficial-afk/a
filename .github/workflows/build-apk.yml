name: Build APK

on:
  push:
    branches: [ claude/apk-build-repo-nsc0ov ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # ubuntu-latest runners already ship an Android SDK at this path; avoid
      # android-actions/setup-android, which tries to install the long-removed
      # legacy "tools" package and fails outright.
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept licenses & install required SDK platform / build-tools
        run: |
          SDKMANAGER=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          echo "Using sdkmanager: $SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: touch-trigger-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # The Actions artifact above is served from a blob-storage host that isn't
      # reachable from where this APK gets picked up next, so also commit it
      # straight into the repo (git handles binary content natively) as a
      # simple, always-reachable handoff.
      - name: Commit built APK to repo
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/touch-trigger-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/touch-trigger-debug.apk
          git commit -m "Add built debug APK [skip ci]" || echo "Nothing to commit"
          git push
