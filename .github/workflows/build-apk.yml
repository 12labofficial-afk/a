name: Build APK

on:
  push:
    branches: [ claude/apk-build-repo-nsc0ov ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK platform & build-tools
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" --sdk_root="${ANDROID_SDK_ROOT}"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: touch-trigger-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
